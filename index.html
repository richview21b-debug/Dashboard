<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <!-- iPad mini 5 適合之視口與 PWA 全螢幕指令 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="日常 Dashboard">
  <title>香港日常資訊 Dashboard (iPad mini 全螢幕版)</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffd1ff 0%, #fad0c4 99%, #fad0c4 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: #f3c4fb;
      --primary-color: #d45087;
      --text-dark: #3c233d;
      --accent-pink: #ff85a2;
      --accent-purple: #9c27b0;
      --shadow: 0 8px 20px rgba(212, 80, 135, 0.15);
      --holiday-red: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text-dark);
      padding: 10px;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      overflow: hidden;
      font-size: 16px;
      transition: background 1s ease;
    }

    /* 誇張醒目高對比度提示 Banner */
    .rain-alert-banner {
      display: none;
      background: #ff0033;
      color: #ffffff;
      border: 4px solid #ffeb3b;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 8px;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.8);
      animation: alertBlink 1.2s infinite alternate;
      line-height: 1.3;
    }

    @keyframes alertBlink {
      0% { background: #ff0033; transform: scale(1); }
      100% { background: #ff5722; transform: scale(1.008); box-shadow: 0 0 25px rgba(255, 235, 59, 0.9); }
    }

    .main-container {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 10px;
      flex: 1;
      min-height: 0;
      margin-bottom: 8px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      border: 2.5px solid var(--card-border);
      padding: 10px 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .text-giant {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 900;
      color: var(--primary-color);
      line-height: 1.1;
    }

    /* --- 左側欄 --- */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      min-height: 0;
    }

    .time-card { flex: 0.75; justify-content: center; }
    .weather-card { flex: 0.85; justify-content: center; }

    .weather-info {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      padding: 4px;
    }

    .current-weather-icon { width: 45px; height: 45px; object-fit: contain; }

    /* 烚蛋計時器 */
    .egg-timer-card { flex: 0.85; justify-content: space-between; }
    .egg-btn-group { display: flex; gap: 8px; margin-top: 2px; }
    .egg-btn {
      flex: 1;
      padding: 6px 2px;
      border: 2px solid var(--card-border);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
    }
    .egg-btn.active { background: var(--accent-pink); color: white; border-color: var(--primary-color); }
    .egg-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      padding: 4px 10px;
    }
    .egg-ctrl-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 倒數公眾假期 (最接近 1 個) */
    .holiday-countdown-card { flex: 0.9; justify-content: center; }
    .holiday-single-box {
      background: rgba(255, 255, 255, 0.75);
      border-left: 6px solid var(--primary-color);
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
    }
    .holiday-item-title { font-size: 1.1rem; font-weight: 800; color: #d81b60; }
    .holiday-item-sub { font-size: 0.8rem; color: #666; font-weight: 600; }
    .holiday-item-days { font-size: 1.6rem; font-weight: 900; color: var(--primary-color); }

    /* Gemini AI 助手 (左側) */
    .gemini-card {
      flex: 0.75;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(243, 229, 245, 0.9));
      justify-content: center;
    }
    .gemini-input-group { display: flex; gap: 6px; }
    .gemini-input {
      flex: 1;
      padding: 6px 10px;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    .gemini-btn {
      background: linear-gradient(135deg, #ff85a2, #b388ff);
      color: white;
      border: none;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* --- 右側欄 (放大版月曆) --- */
    .right-panel { height: 100%; display: flex; flex-direction: column; }
    .calendar-card { flex: 1; padding: 10px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .calendar-title { font-size: 1.4rem; font-weight: 900; color: var(--primary-color); }
    .calendar-nav button {
      background: var(--accent-pink);
      color: white; border: none; border-radius: 8px;
      width: 30px; height: 30px; font-size: 1rem; cursor: pointer; font-weight: bold;
    }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; flex: 1; }
    .weekday-header { font-size: 0.9rem; font-weight: 800; color: var(--accent-purple); text-align: center; }
    .weekday-header.sun { color: var(--holiday-red); }

    .day-cell {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      padding: 2px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .day-cell.today { border: 2px solid var(--accent-pink); background: #fff; }
    .day-cell.is-public-holiday { background: #ffebee; }
    .day-cell.is-public-holiday .day-number { color: var(--holiday-red); font-weight: 900; }
    .day-number { font-size: 1rem; font-weight: 800; margin-left: 2px; }

    .day-tags { display: flex; flex-direction: column; gap: 1px; width: 100%; margin-top: 1px; }
    .tag {
      font-size: 0.65rem; padding: 0px 2px; border-radius: 3px;
      line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold;
    }
    .tag-mom { background: #ffcdd2; color: #b71c1c; }
    .tag-dad { background: #bbdefb; color: #0d47a1; }
    .tag-custom { background: #e1bee7; color: #4a148c; }
    .tag-holiday { background: #ffcdd2; color: #b71c1c; }
    .tag-birthday { background: #fff9c4; color: #f57f17; border: 1px solid #ffe082; }

    /* 底部 9天天氣預報 */
    .forecast-card { height: 110px; flex-shrink: 0; }
    .forecast-container { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; height: 100%; align-items: center; }
    .forecast-item {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 10px; padding: 2px; text-align: center;
      display: flex; flex-direction: column; justify-content: space-around; align-items: center; height: 75px;
    }
    .forecast-date { font-size: 0.72rem; font-weight: 800; }
    .forecast-icon { width: 28px; height: 28px; object-fit: contain; }
    .forecast-temp { font-size: 0.8rem; font-weight: 900; color: var(--primary-color); }

    /* 通用 Modal 彈出視窗 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      padding: 22px; border-radius: 20px; width: 340px;
      display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);
      color: var(--text-dark);
    }
    .modal-title { font-size: 1.25rem; font-weight: bold; color: var(--primary-color); }
    .modal-options label { display: flex; align-items: center; gap: 8px; font-size: 1rem; margin-bottom: 6px; }
    .modal-input { width: 100%; padding: 8px; font-size: 0.95rem; border: 1.5px solid var(--card-border); border-radius: 8px; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-btns button { padding: 8px 16px; font-size: 1rem; border: none; border-radius: 10px; cursor: pointer; }
    .btn-save { background: var(--accent-pink); color: white; font-weight: bold; }

    /* 烚蛋完成 Modal 專屬樣式 (字體增大 2pt = 1.35rem, Dash box 同款配色) */
    .egg-modal-content {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 22px;
      padding: 24px;
      width: 320px;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .egg-modal-title {
      font-size: 1.35rem; /* 比一般標題放大 2pt */
      font-weight: 900;
      color: var(--primary-color);
      line-height: 1.3;
    }
    .egg-modal-text {
      font-size: 1.15rem; /* 字體加大 */
      font-weight: 700;
      color: var(--text-dark);
    }
    .egg-modal-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(212, 80, 135, 0.3);
    }
  </style>
</head>
<body>

  <!-- 誇張醒目特別天氣 / 落雨與注意事項提示 Banner -->
  <div class="rain-alert-banner" id="rain-alert-banner">
    <span style="font-size: 1.4rem;">⚠️</span>
    <div>
      <div id="rain-alert-text">特別天氣 / 油麻地落雨提示</div>
      <div id="rain-alert-action" style="font-size: 0.95rem; font-weight: 700; color: #ffff00; margin-top: 2px;">提醒事項：---</div>
    </div>
  </div>

  <div class="main-container">
    <!-- 左側資訊欄 -->
    <div class="left-panel">
      <!-- 時間 -->
      <div class="card time-card">
        <div class="section-title">⭐ 香港時間</div>
        <div class="text-giant" id="clock-time">12:00:00 PM</div>
        <div style="font-size:1rem; font-weight:700;" id="clock-date">----年--月--日 週-</div>
      </div>

      <!-- 即時天氣 (油麻地 / 油尖旺) -->
      <div class="card weather-card">
        <div class="section-title">💖 即時天氣 (油麻地)</div>
        <div class="weather-info">
          <img id="current-weather-icon" class="current-weather-icon" src="" alt="天氣圖標" style="display:none;">
          <div>
            <div style="font-size: 0.75rem; font-weight: bold;">氣溫</div>
            <div class="text-giant" id="current-temp" style="font-size: 1.6rem;">--°C</div>
          </div>
          <div>
            <div style="font-size: 0.75rem; font-weight: bold;">相對濕度</div>
            <div class="text-giant" id="current-humidity" style="font-size: 1.6rem;">--%</div>
          </div>
        </div>
      </div>

      <!-- 烚蛋計時器 (6min 溫泉蛋 / 8min 糖心蛋) -->
      <div class="card egg-timer-card">
        <div class="section-title">🥚 烚蛋計時器</div>
        <div class="egg-btn-group">
          <button class="egg-btn active" onclick="selectEggPreset(360, this)">6分鐘<br>溫泉蛋</button>
          <button class="egg-btn" onclick="selectEggPreset(480, this)">8分鐘<br>糖心蛋</button>
        </div>
        <div class="egg-display">
          <div class="text-giant" id="egg-timer-text" style="font-size: 1.5rem;">06:00</div>
          <div>
            <button class="egg-ctrl-btn" id="egg-start-btn" onclick="toggleEggTimer()">開始</button>
            <button class="egg-ctrl-btn" style="background:#888;" onclick="resetEggTimer()">重置</button>
          </div>
        </div>
      </div>

      <!-- 倒數公眾假期 (最接近的 1 個) -->
      <div class="card holiday-countdown-card">
        <div class="section-title">🐰 最接近的公眾假期</div>
        <div id="holiday-container">
          <div style="font-size:0.85rem; color:#666;">載入假期中...</div>
        </div>
      </div>

      <!-- Gemini AI 隨身助手 (左側) -->
      <div class="card gemini-card">
        <div class="section-title">✨ Gemini AI 助手</div>
        <div class="gemini-input-group">
          <input type="text" id="gemini-prompt" class="gemini-input" placeholder="問 Gemini 嘢 (如：今晚食咩？)" onkeypress="if(event.key==='Enter') askGemini()">
          <button class="gemini-btn" onclick="askGemini()">開啟</button>
        </div>
      </div>
    </div>

    <!-- 右側欄 (放大版月曆) -->
    <div class="right-panel">
      <div class="card calendar-card">
        <div class="calendar-header">
          <div class="calendar-title" id="calendar-month-year">----年 -月</div>
          <div class="calendar-nav">
            <button onclick="changeMonth(-1)">&lt;</button>
            <button onclick="changeMonth(1)">&gt;</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid">
          <!-- 動態渲染月曆 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 底部 9 天天氣預報 -->
  <div class="card forecast-card">
    <div class="section-title" style="margin-bottom: 2px; font-size:0.95rem;">✨ 9 天天氣預報</div>
    <div class="forecast-container" id="forecast-container">
      <!-- 動態渲染預報 -->
    </div>
  </div>

  <!-- 日期標記 Modal -->
  <div class="modal" id="date-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-date-label">設定日期標記</div>
      <div class="modal-options">
        <label><input type="checkbox" id="chk-mom"> 媽媽上班日 👩‍💻</label>
        <label><input type="checkbox" id="chk-dad"> 爸爸休息日 ☕</label>
      </div>
      <div>
        <label style="font-size: 0.85rem; font-weight: bold;">自訂 Remark (多條請用逗點或換行分隔)：</label>
        <textarea id="txt-custom" class="modal-input" style="height: 60px; resize: none;" placeholder="例如：生日 🎉, 睇醫生 15:00"></textarea>
      </div>
      <div class="modal-btns">
        <button onclick="closeModal()">取消</button>
        <button class="btn-save" onclick="saveDateSettings()">儲存</button>
      </div>
    </div>
  </div>

  <!-- 烚蛋完成提示 Modal (字體加大 2pt + Dash Box 背景顏色) -->
  <div class="modal" id="egg-finish-modal">
    <div class="egg-modal-content">
      <div class="egg-modal-title">🔔 烚蛋完成提示！</div>
      <div class="egg-modal-text" id="egg-modal-msg">時間到了！新鮮烚蛋已煮好！</div>
      <button class="egg-modal-btn" onclick="closeEggModal()">知道了 (過冷河 🧊)</button>
    </div>
  </div>

  <script>
    // --- 1. 全局狀態與自動主題轉換 ---
    let currentDate = new Date();
    let lastCheckedDayStr = '';
    let selectedDateKey = '';
    let userEvents = JSON.parse(localStorage.getItem('dashboard_events_v2') || '{}');
    let publicHolidaysMap = {};

    const cuteThemeGradients = [
      "linear-gradient(135deg, #ffd1ff 0%, #fad0c4 99%, #fad0c4 100%)",
      "linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)",
      "linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)",
      "linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)",
      "linear-gradient(135deg, #fccb90 0%, #d782d9 100%)"
    ];

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;

      document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 ${weekDays[now.getDay()]}`;

      // 凌晨 12:00 自動切換跨月與可愛底色
      const todayStr = `${year}-${month}-${date}`;
      if (lastCheckedDayStr !== '' && lastCheckedDayStr !== todayStr) {
        currentDate = new Date();
        renderCalendar();
        fetchHolidaysAndCalculate();
        applyDailyTheme(now);
      }
      lastCheckedDayStr = todayStr;
    }

    function applyDailyTheme(dateObj) {
      const dayOfYear = Math.floor((dateObj - new Date(dateObj.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
      document.body.style.background = cuteThemeGradients[dayOfYear % cuteThemeGradients.length];
    }

    setInterval(updateClock, 1000);
    updateClock();
    applyDailyTheme(new Date());

    // --- 2. 天文台 API (油麻地 / 油尖旺雨量與特別天氣注意事項) ---
    async function fetchWeather() {
      try {
        const rCurrent = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const dCurrent = await rCurrent.json();

        // 京士柏測量站（最接近油麻地）
        if (dCurrent.temperature?.data?.length > 0) {
          const tempObj = dCurrent.temperature.data.find(t => t.place === "京士柏") || dCurrent.temperature.data[0];
          document.getElementById('current-temp').textContent = `${tempObj.value}°C`;
        }
        if (dCurrent.humidity?.data?.length > 0) {
          document.getElementById('current-humidity').textContent = `${dCurrent.humidity.data[0].value}%`;
        }
        if (dCurrent.icon?.length > 0) {
          const iconImg = document.getElementById('current-weather-icon');
          iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${dCurrent.icon[0]}.png`;
          iconImg.style.display = 'block';
        }

        // 取得特別天氣警告
        const rWarn = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const dWarn = await rWarn.json();

        checkRainAndWarnings(dCurrent, dWarn);

        // 9天天氣預報
        const rForecast = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const dForecast = await rForecast.json();
        const forecastContainer = document.getElementById('forecast-container');
        forecastContainer.innerHTML = '';

        (dForecast.weatherForecast || []).slice(0, 9).forEach(item => {
          const m = item.forecastDate.substring(4, 6);
          const d = item.forecastDate.substring(6, 8);
          const week = item.week.replace('星期', '週');
          const div = document.createElement('div');
          div.className = 'forecast-item';
          div.innerHTML = `
            <div class="forecast-date">${m}/${d}(${week})</div>
            <img class="forecast-icon" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${item.ForecastIcon}.png">
            <div class="forecast-temp">${item.forecastMintemp.value}°-${item.forecastMaxtemp.value}°C</div>
          `;
          forecastContainer.appendChild(div);
        });
      } catch (e) {
        console.error('Weather API Error:', e);
      }
    }

    function checkRainAndWarnings(weatherData, warnData) {
      const banner = document.getElementById('rain-alert-banner');
      const bannerText = document.getElementById('rain-alert-text');
      const bannerAction = document.getElementById('rain-alert-action');

      let alertMessages = [];
      let actionReminders = [];

      // 檢查油尖旺（油麻地所在區域）雨量
      let yauTsimMongRain = 0;
      if (weatherData.rainfall?.data) {
        const ytmData = weatherData.rainfall.data.find(r => r.place === "油尖旺");
        if (ytmData && ytmData.max > 0) {
          yauTsimMongRain = ytmData.max;
          alertMessages.push(`📍油麻地(油尖旺)錄得雨量 ${yauTsimMongRain}mm`);
          actionReminders.push("出門請務必帶遮，慎防鞋襪濕透及地滑！");
        }
      }

      // 檢查天文台官方特別天氣警告與提議
      if (warnData && Object.keys(warnData).length > 0) {
        for (let key in warnData) {
          if (warnData[key].name) {
            const warnName = warnData[key].name;
            alertMessages.push(`⚠️ ${warnName}`);

            if (warnName.includes('暴雨') || warnName.includes('雷暴')) {
              actionReminders.push("請留在安全室內，遠離低窪地區，注意雷擊與積水！");
            } else if (warnName.includes('颱風') || warnName.includes('熱帶氣旋')) {
              actionReminders.push("請緊閉門窗，避免戶外活動及靠近海岸線！");
            } else if (warnName.includes('酷熱')) {
              actionReminders.push("請多補充水分，避免長時間暴曬，預防中暑！");
            } else if (warnName.includes('寒冷')) {
              actionReminders.push("請注意保暖，穿足夠禦寒衣物！");
            }
          }
        }
      }

      // 一般天氣預測有雨提醒
      if (alertMessages.length === 0 && weatherData.forecastDesc && (weatherData.forecastDesc.includes('雨') || weatherData.forecastDesc.includes('陣雨'))) {
        alertMessages.push("🌧️ 預測油麻地一帶有陣雨");
        actionReminders.push("出門建議隨身攜帶折疊傘，以備不時之需。");
      }

      if (alertMessages.length > 0) {
        bannerText.textContent = alertMessages.join(' | ');
        bannerAction.textContent = `提醒事項：${actionReminders.length > 0 ? actionReminders[0] : '請注意天氣變化與安全！'}`;
        banner.style.display = 'flex';
      } else {
        banner.style.display = 'none';
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 300000);

    // --- 3. 烚蛋計時器 (6min 溫泉蛋 / 8min 糖心蛋) 與客製化 Modal ---
    let eggTotalTime = 360;
    let eggRemainingTime = 360;
    let eggInterval = null;
    let eggTypeLabel = '6分鐘溫泉蛋';

    function selectEggPreset(seconds, btn) {
      clearInterval(eggInterval);
      eggInterval = null;
      document.getElementById('egg-start-btn').textContent = '開始';
      document.querySelectorAll('.egg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      eggTotalTime = seconds;
      eggRemainingTime = seconds;
      eggTypeLabel = seconds === 360 ? '6分鐘溫泉蛋' : '8分鐘糖心蛋';
      updateEggDisplay();
    }

    function updateEggDisplay() {
      const m = String(Math.floor(eggRemainingTime / 60)).padStart(2, '0');
      const s = String(eggRemainingTime % 60).padStart(2, '0');
      document.getElementById('egg-timer-text').textContent = `${m}:${s}`;
    }

    function toggleEggTimer() {
      const startBtn = document.getElementById('egg-start-btn');
      if (eggInterval) {
        clearInterval(eggInterval);
        eggInterval = null;
        startBtn.textContent = '繼續';
      } else {
        if (eggRemainingTime <= 0) eggRemainingTime = eggTotalTime;
        startBtn.textContent = '暫停';
        eggInterval = setInterval(() => {
          eggRemainingTime--;
          updateEggDisplay();
          if (eggRemainingTime <= 0) {
            clearInterval(eggInterval);
            eggInterval = null;
            startBtn.textContent = '開始';
            showEggModal();
          }
        }, 1000);
      }
    }

    function resetEggTimer() {
      clearInterval(eggInterval);
      eggInterval = null;
      document.getElementById('egg-start-btn').textContent = '開始';
      eggRemainingTime = eggTotalTime;
      updateEggDisplay();
    }

    function showEggModal() {
      document.getElementById('egg-modal-msg').textContent = `${eggTypeLabel} 已經煮好啦！完美時間到位！`;
      document.getElementById('egg-finish-modal').style.display = 'flex';
    }

    function closeEggModal() {
      document.getElementById('egg-finish-modal').style.display = 'none';
      resetEggTimer();
    }

    // --- 4. 最接近 1 個公眾假期倒數 ---
    async function fetchHolidaysAndCalculate() {
      const today = new Date();
      const currentYear = today.getFullYear();
      try {
        const [resThisYear, resNextYear] = await Promise.all([
          fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear}/HK`),
          fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear + 1}/HK`)
        ]);
        const data1 = await resThisYear.json();
        const data2 = await resNextYear.json();
        const list = [...data1, ...data2];

        publicHolidaysMap = {};
        list.forEach(h => publicHolidaysMap[h.date] = h.localName || h.name);

        renderTop1Holiday(list);
        renderCalendar();
      } catch (e) {
        console.error('Holiday API Error:', e);
      }
    }

    function renderTop1Holiday(list) {
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      // 只取最接近的 1 個假期
      const nextHoliday = list.find(h => h.date > todayStr);
      const container = document.getElementById('holiday-container');
      container.innerHTML = '';

      if (!nextHoliday) {
        container.innerHTML = '<div style="font-size:0.85rem; color:#666;">近期無公眾假期</div>';
        return;
      }

      const parts = nextHoliday.date.split('-');
      const targetDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));

      let workdays = 0;
      let curr = new Date(todayDate);
      curr.setDate(curr.getDate() + 1);

      while (curr < targetDate) {
        if (curr.getDay() !== 0) workdays++; // 自動扣除星期日
        curr.setDate(curr.getDate() + 1);
      }

      const div = document.createElement('div');
      div.className = 'holiday-single-box';
      div.innerHTML = `
        <div>
          <div class="holiday-item-title">${nextHoliday.localName || nextHoliday.name}</div>
          <div class="holiday-item-sub">${parseInt(parts[1])}月${parseInt(parts[2])}日 (距離淨工作天)</div>
        </div>
        <div class="holiday-item-days">${workdays}<span style="font-size:0.85rem;">天</span></div>
      `;
      container.appendChild(div);
    }

    // --- 5. 月曆渲染（支援多重 Remark & 生日每年自動重複）---
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('calendar-month-year').textContent = `${year}年 ${month + 1}月`;
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      weekdays.forEach((w, idx) => {
        const h = document.createElement('div');
        h.className = `weekday-header ${idx === 0 ? 'sun' : ''}`;
        h.textContent = w;
        grid.appendChild(h);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const monthStr = String(month + 1).padStart(2, '0');
        const dayStr = String(d).padStart(2, '0');
        const dateStr = `${year}-${monthStr}-${dayStr}`;
        const monthDayStr = `${monthStr}-${dayStr}`;

        const isPublicHoliday = !!publicHolidaysMap[dateStr];
        if (isPublicHoliday) cell.classList.add('is-public-holiday');
        if (year === today.getFullYear() && month === today.getMonth() && d === today.getDate()) {
          cell.classList.add('today');
        }

        let tagsHTML = '';
        if (isPublicHoliday) {
          tagsHTML += `<span class="tag tag-holiday">${publicHolidaysMap[dateStr]}</span>`;
        }

        // 載入該日全部 Remark (包含生日自動重複邏輯)
        const remarks = getCombinedRemarks(dateStr, monthDayStr);
        remarks.forEach(r => {
          if (r.type === 'mom') tagsHTML += `<span class="tag tag-mom">媽返</span>`;
          if (r.type === 'dad') tagsHTML += `<span class="tag tag-dad">爸休</span>`;
          if (r.type === 'custom') {
            const isBirthday = r.text.includes('生日');
            const tagClass = isBirthday ? 'tag-birthday' : 'tag-custom';
            const icon = isBirthday ? '🎂 ' : '';
            tagsHTML += `<span class="tag ${tagClass}">${icon}${r.text}</span>`;
          }
        });

        cell.innerHTML = `
          <span class="day-number">${d}</span>
          <div class="day-tags">${tagsHTML}</div>
        `;

        cell.onclick = () => openModal(dateStr);
        grid.appendChild(cell);
      }
    }

    function getCombinedRemarks(fullDate, monthDay) {
      let result = [];

      // 1. 檢查具體日期特定紀錄
      if (userEvents[fullDate]) {
        const ev = userEvents[fullDate];
        if (ev.mom) result.push({ type: 'mom' });
        if (ev.dad) result.push({ type: 'dad' });
        if (ev.customList) {
          ev.customList.forEach(txt => result.push({ type: 'custom', text: txt }));
        }
      }

      // 2. 檢查每年重複的生日（key 儲存格式為 BD_MM-DD）
      if (userEvents[`BD_${monthDay}`]) {
        const bdEv = userEvents[`BD_${monthDay}`];
        if (bdEv.customList) {
          bdEv.customList.forEach(txt => result.push({ type: 'custom', text: txt }));
        }
      }

      return result;
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    // --- 6. Gemini Deep Link 呼叫 iPad App ---
    function askGemini() {
      const input = document.getElementById('gemini-prompt');
      const prompt = input.value.trim();
      if (prompt) {
        window.location.href = `googlegemini://prompt?text=${encodeURIComponent(prompt)}`;
        setTimeout(() => {
          window.open(`https://gemini.google.com/app?q=${encodeURIComponent(prompt)}`, '_blank');
        }, 1200);
        input.value = '';
      } else {
        window.location.href = `googlegemini://`;
      }
    }

    // --- 7. 日期標記 Modal ---
    function openModal(dateKey) {
      selectedDateKey = dateKey;
      const monthDayKey = dateKey.substring(5);
      const holidayName = publicHolidaysMap[dateKey] ? ` [${publicHolidaysMap[dateKey]}]` : '';
      document.getElementById('modal-date-label').textContent = `設定 ${dateKey}${holidayName} 標記`;

      const ev = userEvents[dateKey] || {};
      const bdEv = userEvents[`BD_${monthDayKey}`] || {};

      document.getElementById('chk-mom').checked = !!ev.mom;
      document.getElementById('chk-dad').checked = !!ev.dad;

      let allCustom = [];
      if (ev.customList) allCustom.push(...ev.customList);
      if (bdEv.customList) allCustom.push(...bdEv.customList);

      document.getElementById('txt-custom').value = allCustom.join(', ');
      document.getElementById('date-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('date-modal').style.display = 'none';
    }

    function saveDateSettings() {
      const mom = document.getElementById('chk-mom').checked;
      const dad = document.getElementById('chk-dad').checked;
      const rawCustom = document.getElementById('txt-custom').value.trim();
      const monthDayKey = selectedDateKey.substring(5);

      const list = rawCustom ? rawCustom.split(/[,\n，]/).map(s => s.trim()).filter(s => s.length > 0) : [];

      const normalRemarks = list.filter(s => !s.includes('生日'));
      const birthdayRemarks = list.filter(s => s.includes('生日'));

      if (mom || dad || normalRemarks.length > 0) {
        userEvents[selectedDateKey] = { mom, dad, customList: normalRemarks };
      } else {
        delete userEvents[selectedDateKey];
      }

      if (birthdayRemarks.length > 0) {
        userEvents[`BD_${monthDayKey}`] = { customList: birthdayRemarks };
      } else {
        delete userEvents[`BD_${monthDayKey}`];
      }

      localStorage.setItem('dashboard_events_v2', JSON.stringify(userEvents));
      closeModal();
      renderCalendar();
    }

    fetchHolidaysAndCalculate();
  </script>
</body>
