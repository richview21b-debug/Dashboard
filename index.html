<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港日常資訊 Dashboard (iPad mini 專用版)</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffd1ff 0%, #fad0c4 99%, #fad0c4 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: #f3c4fb;
      --primary-color: #d45087;
      --text-dark: #4a2e4b;
      --accent-pink: #ff85a2;
      --accent-purple: #9c27b0;
      --shadow: 0 8px 20px rgba(212, 80, 135, 0.15);
      --holiday-red: #d32f2f;
      --rain-bg: #ffebee;
      --rain-border: #f44336;
      --rain-text: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text-dark);
      padding: 12px;
      overflow: hidden;
      font-size: 16px;
    }

    /* 降雨警告 Banner (有雨時動態顯示) */
    .rain-alert-banner {
      display: none; /* 預設隱藏 */
      background: var(--rain-bg);
      border: 2px solid var(--rain-border);
      color: var(--rain-text);
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(244, 67, 54, 0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }

    /* 主區域 Layout (iPad mini 適合左右 1.1:1 比列) */
    .main-container {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
      margin-bottom: 10px;
    }

    /* 卡片通用樣式 */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 2.5px solid var(--card-border);
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 大字體標準：iPad mini 上非常清晰 */
    .text-giant {
      font-size: clamp(2.2rem, 3.8vw, 2.8rem);
      font-weight: 900;
      color: var(--primary-color);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .text-sub {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* --- 左側欄 --- */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .time-card {
      flex: 0.9;
      justify-content: center;
    }

    .weather-card {
      flex: 1;
      justify-content: center;
    }

    .weather-info {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 14px;
      padding: 8px;
    }

    .current-weather-icon {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .holiday-countdown-card {
      flex: 1.2;
      justify-content: center;
    }

    .countdown-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      padding: 8px;
      margin-top: 4px;
      text-align: center;
    }

    .countdown-holiday-name {
      font-size: 1.3rem;
      font-weight: 900;
      color: #d81b60;
    }

    .daily-quote {
      font-size: 1.1rem;
      font-weight: 800;
      color: #d81b60;
      margin-top: 6px;
      padding: 6px 10px;
      background: rgba(255, 230, 237, 0.9);
      border-radius: 10px;
      width: 100%;
      text-align: center;
    }

    /* --- 右側欄 (月曆 + Gemini) --- */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .calendar-card {
      flex: 1;
      justify-content: flex-start;
      padding: 12px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .calendar-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--primary-color);
    }

    .calendar-nav button {
      background: var(--accent-pink);
      color: white;
      border: none;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
    }

    .holiday-banner {
      background: #ffe6ed;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #d81b60;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      flex: 1;
    }

    .weekday-header {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent-purple);
      padding-bottom: 2px;
    }

    .weekday-header.sun {
      color: var(--holiday-red);
    }

    .day-cell {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      min-height: 42px;
      position: relative;
    }

    .day-cell.today {
      border: 2.5px solid var(--accent-pink);
      background: #fff;
      font-weight: bold;
    }

    /* 公眾假期樣式：數字紅色 + 底色粉紅 */
    .day-cell.is-public-holiday {
      background: #ffebee;
    }

    .day-cell.is-public-holiday .day-number {
      color: var(--holiday-red);
      font-weight: 900;
    }

    .day-number {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .day-tags {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
      margin-top: 2px;
      width: 100%;
    }

    .tag {
      font-size: 0.72rem;
      padding: 1px 3px;
      border-radius: 4px;
      line-height: 1.1;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: bold;
    }

    .tag-mom { background: #ffcdd2; color: #b71c1c; }
    .tag-dad { background: #bbdefb; color: #0d47a1; }
    .tag-custom { background: #e1bee7; color: #4a148c; }
    .tag-holiday { background: #ffcdd2; color: #b71c1c; }

    /* Gemini AI 助手 */
    .gemini-card {
      height: 90px;
      flex-shrink: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(243, 229, 245, 0.9));
    }

    .gemini-input-group {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .gemini-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      font-size: 1.05rem;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-dark);
    }

    .gemini-btn {
      background: linear-gradient(135deg, #ff85a2, #b388ff);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 底部欄 (9天預報) */
    .forecast-card {
      height: 140px;
      flex-shrink: 0;
    }

    .forecast-container {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 6px;
      height: 100%;
      align-items: center;
    }

    .forecast-item {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      padding: 4px 2px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      height: 95px;
    }

    .forecast-date {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .forecast-icon {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .forecast-temp {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--primary-color);
    }

    /* Modal 彈出視窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.35);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 20px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .modal-title { font-size: 1.25rem; font-weight: bold; color: var(--primary-color); }
    .modal-options label { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; margin-bottom: 8px; }
    .modal-input { width: 100%; padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-btns button { padding: 8px 16px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; }
    .btn-save { background: var(--accent-pink); color: white; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 天文台落雨提示 Banner -->
  <div class="rain-alert-banner" id="rain-alert-banner">
    <span>🌧️ 本區落雨提示：</span>
    <span id="rain-alert-text">天文台顯示目前本港部分地區有雨或預測有陣雨，出門記得帶傘！</span>
  </div>

  <div class="main-container">
    <!-- 左側資訊欄 -->
    <div class="left-panel">
      <!-- 時間 -->
      <div class="card time-card">
        <div class="section-title">⭐ 香港時間</div>
        <div class="text-giant" id="clock-time">12:00:00 PM</div>
        <div class="text-sub" id="clock-date">2026年09月08日 週二</div>
      </div>

      <!-- 即時天氣 -->
      <div class="card weather-card">
        <div class="section-title">💖 即時天氣</div>
        <div class="weather-info">
          <img id="current-weather-icon" class="current-weather-icon" src="" alt="天氣圖標" style="display:none;">
          <div>
            <div style="font-size: 0.95rem; font-weight: bold;">氣溫</div>
            <div class="text-giant" id="current-temp" style="font-size: 2.2rem;">--°C</div>
          </div>
          <div>
            <div style="font-size: 0.95rem; font-weight: bold;">相對濕度</div>
            <div class="text-giant" id="current-humidity" style="font-size: 2.2rem;">--%</div>
          </div>
        </div>
      </div>

      <!-- 下一個公眾假期倒數 -->
      <div class="card holiday-countdown-card">
        <div class="section-title">🐰 距離下一個公眾假期</div>
        <div class="countdown-box">
          <div class="countdown-holiday-name" id="next-holiday-name">載入中...</div>
          <div>
            <span class="text-giant" id="countdown-workdays">--</span> 
            <span style="font-size: 1.3rem; font-weight: 800; color: var(--primary-color);">個工作日</span>
          </div>
          <div style="font-size: 0.95rem; color: var(--text-dark);" id="next-holiday-date">(不含星期日)</div>
          <div class="daily-quote" id="daily-quote">💪 撐住呀！返多幾日工又可以放假啦！</div>
        </div>
      </div>
    </div>

    <!-- 右側欄 (月曆 + Gemini) -->
    <div class="right-panel">
      <!-- 月曆 -->
      <div class="card calendar-card">
        <div class="calendar-header">
          <div class="calendar-title" id="calendar-month-year">----年 -月</div>
          <div class="calendar-nav">
            <button onclick="changeMonth(-1)">&lt;</button>
            <button onclick="changeMonth(1)">&gt;</button>
          </div>
        </div>

        <!-- 當月公眾假期提示列 -->
        <div class="holiday-banner" id="holiday-banner">
          🎉 本月公眾假期：載入中...
        </div>

        <div class="calendar-grid" id="calendar-grid">
          <!-- 動態渲染月曆 -->
        </div>
      </div>

      <!-- Gemini AI 助手 -->
      <div class="card gemini-card">
        <div class="section-title">✨ Gemini AI 隨身助手</div>
        <div class="gemini-input-group">
          <input type="text" id="gemini-prompt" class="gemini-input" placeholder="問下 Gemini 嘢啦... (例如：今晚食咩好？)" onkeypress="if(event.key==='Enter') askGemini()">
          <button class="gemini-btn" onclick="askGemini()">提問</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部 9 天天氣預報 -->
  <div class="card forecast-card">
    <div class="section-title" style="margin-bottom: 2px;">✨ 9 天天氣預報</div>
    <div class="forecast-container" id="forecast-container">
      <!-- 動態渲染預報 -->
    </div>
  </div>

  <!-- 日期標記 Modal -->
  <div class="modal" id="date-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-date-label">設定日期標記</div>
      <div class="modal-options">
        <label><input type="checkbox" id="chk-mom"> 媽媽上班日 👩‍💻</label>
        <label><input type="checkbox" id="chk-dad"> 爸爸休息日 ☕</label>
      </div>
      <div>
        <label style="font-size: 0.95rem; font-weight: bold;">自訂文字 / Emoji：</label>
        <input type="text" id="txt-custom" class="modal-input" placeholder="例如：生日 🎉 / 睇醫生 🩺">
      </div>
      <div class="modal-btns">
        <button onclick="closeModal()">取消</button>
        <button class="btn-save" onclick="saveDateSettings()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // --- 狀態管理 ---
    let currentDate = new Date(); // 月曆當前檢視的日期
    let lastCheckedDayStr = '';   // 紀錄上次檢查的日期字串 (用作跨日自動切換)
    let selectedDateKey = '';
    let userEvents = JSON.parse(localStorage.getItem('dashboard_events') || '{}');
    let publicHolidaysMap = {};

    const cantoneseQuotes = [
      "💪 撐住呀！返多幾日工又可以放假啦！",
      "☕ 頂住！飲杯奶茶/咖啡再繼續拼搏！",
      "🔥 距離放假又近一步，衝呀打工人！",
      "✨ 做完今日嘅嘢，又離假期近咗啦！加油！",
      "🍔 今晚食餐好嘅獎勵下自己，放假指日可待！",
      "🧘‍♀️ 唔好急最緊要快，再撐一陣就放假！",
      "🎉 假期就在不遠處，堅持住，勝利屬於你！"
    ];

    // --- 1. 時間更新與每日自動跨日切換 ---
    function updateClock() {
      const now = new Date();
      
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      
      document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const week = weekDays[now.getDay()];

      document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 ${week}`;

      // 自動檢查是否過了半夜12點 (跨日/跨月自動更新月曆)
      const todayStr = `${year}-${month}-${date}`;
      if (lastCheckedDayStr !== '' && lastCheckedDayStr !== todayStr) {
        currentDate = new Date(); // 將檢視月份更新為最新的今天
        renderCalendar();
        fetchHolidaysAndCalculate();
      }
      lastCheckedDayStr = todayStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 2. 香港天文台 API & 降雨提示邏輯 ---
    async function fetchWeather() {
      try {
        // 取得即時天氣
        const rCurrent = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const dCurrent = await rCurrent.json();
        
        if (dCurrent.temperature && dCurrent.temperature.data.length > 0) {
          const tempObj = dCurrent.temperature.data.find(t => t.place === "京士柏") || dCurrent.temperature.data[0];
          document.getElementById('current-temp').textContent = `${tempObj.value}°C`;
        }
        if (dCurrent.humidity && dCurrent.humidity.data.length > 0) {
          document.getElementById('current-humidity').textContent = `${dCurrent.humidity.data[0].value}%`;
        }
        
        if (dCurrent.icon && dCurrent.icon.length > 0) {
          const iconImg = document.getElementById('current-weather-icon');
          iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${dCurrent.icon[0]}.png`;
          iconImg.style.display = 'block';
        }

        // 判斷本區/全港是否有雨 (檢查雨量資料與天氣報告文字)
        checkRainStatus(dCurrent);

        // 取得 9 天預報
        const rForecast = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const dForecast = await rForecast.json();
        const fList = dForecast.weatherForecast || [];
        
        const forecastContainer = document.getElementById('forecast-container');
        forecastContainer.innerHTML = '';
        
        fList.slice(0, 9).forEach(item => {
          const m = item.forecastDate.substring(4, 6);
          const d = item.forecastDate.substring(6, 8);
          const week = item.week.replace('星期', '週');
          const iconNum = item.ForecastIcon;
          const iconUrl = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconNum}.png`;
          
          const div = document.createElement('div');
          div.className = 'forecast-item';
          div.innerHTML = `
            <div class="forecast-date">${m}/${d} (${week})</div>
            <img class="forecast-icon" src="${iconUrl}" alt="${item.forecastForecast || ''}" title="${item.forecastForecast || ''}">
            <div class="forecast-temp">${item.forecastMintemp.value}°-${item.forecastMaxtemp.value}°C</div>
          `;
          forecastContainer.appendChild(div);
        });
      } catch (e) {
        console.error('Weather API Error:', e);
      }
    }

    function checkRainStatus(weatherData) {
      const banner = document.getElementById('rain-alert-banner');
      const bannerText = document.getElementById('rain-alert-text');
      let isRaining = false;
      let rainDetail = '';

      // 檢查雨量紀錄 (rainfall)
      if (weatherData.rainfall && weatherData.rainfall.data) {
        const activeRain = weatherData.rainfall.data.find(r => r.max > 0);
        if (activeRain) {
          isRaining = true;
          rainDetail = `天文台顯示部分地區（如 ${activeRain.place} 等）過去一小時錄得雨量，出門請帶傘！`;
        }
      }

      // 如果未有具體數據，檢查警告或天氣描述
      if (!isRaining && weatherData.forecastDesc) {
        if (weatherData.forecastDesc.includes('雨') || weatherData.forecastDesc.includes('陣雨')) {
          isRaining = true;
          rainDetail = `天文台預報：${weatherData.forecastDesc}，請記得帶遮！`;
        }
      }

      if (isRaining) {
        bannerText.textContent = rainDetail;
        banner.style.display = 'flex';
      } else {
        banner.style.display = 'none';
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 300000); // 每 5 分鐘更新一次天氣與雨量

    // --- 3. 假期數據載入與倒數計算 ---
    async function fetchHolidaysAndCalculate() {
      const today = new Date();
      const currentYear = today.getFullYear();
      
      try {
        const [resThisYear, resNextYear] = await Promise.all([
          fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear}/HK`),
          fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear + 1}/HK`)
        ]);
        
        const data1 = await resThisYear.json();
        const data2 = await resNextYear.json();
        const list = [...data1, ...data2];

        publicHolidaysMap = {};
        list.forEach(h => {
          publicHolidaysMap[h.date] = h.localName || h.name;
        });

        calculateNextHoliday(list);
        renderCalendar();
      } catch (e) {
        console.error('Holiday API Error:', e);
        document.getElementById('next-holiday-name').textContent = '無法載入假期資料';
      }
    }

    function calculateNextHoliday(list) {
      if (!list || list.length === 0) return;

      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const nextHoliday = list.find(h => h.date > todayStr);

      if (!nextHoliday) {
        document.getElementById('next-holiday-name').textContent = '近期無公眾假期';
        document.getElementById('countdown-workdays').textContent = '--';
        document.getElementById('next-holiday-date').textContent = '';
        return;
      }

      const holidayParts = nextHoliday.date.split('-');
      const holidayDate = new Date(parseInt(holidayParts[0]), parseInt(holidayParts[1]) - 1, parseInt(holidayParts[2]));

      let workdays = 0;
      let curr = new Date(todayDate);
      curr.setDate(curr.getDate() + 1);

      while (curr < holidayDate) {
        if (curr.getDay() !== 0) { // 不算星期日
          workdays++;
        }
        curr.setDate(curr.getDate() + 1);
      }

      const holidayName = nextHoliday.localName || nextHoliday.name;
      document.getElementById('next-holiday-name').textContent = holidayName;
      document.getElementById('countdown-workdays').textContent = workdays;
      document.getElementById('next-holiday-date').textContent = `(${parseInt(holidayParts[1])}月${parseInt(holidayParts[2])}日)`;

      const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
      document.getElementById('daily-quote').textContent = cantoneseQuotes[dayOfYear % cantoneseQuotes.length];
    }

    fetchHolidaysAndCalculate();

    // --- 4. 月曆渲染 ---
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('calendar-month-year').textContent = `${year}年 ${month + 1}月`;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      weekdays.forEach((w, idx) => {
        const h = document.createElement('div');
        h.className = `weekday-header ${idx === 0 ? 'sun' : ''}`;
        h.textContent = w;
        grid.appendChild(h);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        
        const monthStr = String(month + 1).padStart(2, '0');
        const dayStr = String(d).padStart(2, '0');
        const dateStr = `${year}-${monthStr}-${dayStr}`;
        
        const isPublicHoliday = !!publicHolidaysMap[dateStr];
        if (isPublicHoliday) {
          cell.classList.add('is-public-holiday');
        }

        if (year === today.getFullYear() && month === today.getMonth() && d === today.getDate()) {
          cell.classList.add('today');
        }

        let tagsHTML = '';
        if (isPublicHoliday) {
          tagsHTML += `<span class="tag tag-holiday" title="${publicHolidaysMap[dateStr]}">${publicHolidaysMap[dateStr]}</span>`;
        }

        const ev = userEvents[dateStr];
        if (ev) {
          if (ev.mom) tagsHTML += `<span class="tag tag-mom">媽返</span>`;
          if (ev.dad) tagsHTML += `<span class="tag tag-dad">爸休</span>`;
          if (ev.custom) tagsHTML += `<span class="tag tag-custom">${ev.custom}</span>`;
        }

        cell.innerHTML = `
          <span class="day-number">${d}</span>
          <div class="day-tags">${tagsHTML}</div>
        `;

        cell.onclick = () => openModal(dateStr);
        grid.appendChild(cell);
      }

      updateHolidayBanner(year, month + 1);
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function updateHolidayBanner(year, month) {
      const banner = document.getElementById('holiday-banner');
      const prefix = `${year}-${String(month).padStart(2, '0')}`;
      
      const monthHolidays = Object.keys(publicHolidaysMap)
        .filter(dateKey => dateKey.startsWith(prefix))
        .map(dateKey => {
          const dayNum = parseInt(dateKey.split('-')[2]);
          return `${dayNum}日 (${publicHolidaysMap[dateKey]})`;
        });

      if (monthHolidays.length > 0) {
        banner.textContent = `🎉 本月公眾假期：${monthHolidays.join(', ')}`;
      } else {
        banner.textContent = '🎉 本月公眾假期：無';
      }
    }

    // --- 5. Gemini AI 提問 ---
    function askGemini() {
      const input = document.getElementById('gemini-prompt');
      const prompt = input.value.trim();
      if (prompt) {
        const geminiUrl = `https://gemini.google.com/app?q=${encodeURIComponent(prompt)}`;
        window.open(geminiUrl, '_blank');
        input.value = '';
      }
    }

    // --- 6. 日期標記 Modal ---
    function openModal(dateKey) {
      selectedDateKey = dateKey;
      const holidayName = publicHolidaysMap[dateKey] ? ` [${publicHolidaysMap[dateKey]}]` : '';
      document.getElementById('modal-date-label').textContent = `設定 ${dateKey}${holidayName} 標記`;
      
      const ev = userEvents[dateKey] || {};
      document.getElementById('chk-mom').checked = !!ev.mom;
      document.getElementById('chk-dad').checked = !!ev.dad;
      document.getElementById('txt-custom').value = ev.custom || '';

      document.getElementById('date-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('date-modal').style.display = 'none';
    }

    function saveDateSettings() {
      const mom = document.getElementById('chk-mom').checked;
      const dad = document.getElementById('chk-dad').checked;
      const custom = document.getElementById('txt-custom').value.trim();

      if (mom || dad || custom) {
        userEvents[selectedDateKey] = { mom, dad, custom };
      } else {
        delete userEvents[selectedDateKey];
      }

      localStorage.setItem('dashboard_events', JSON.stringify(userEvents));
      closeModal();
      renderCalendar();
    }

    // 初始化渲染
    renderCalendar();
  </script>
</body>
</html>
